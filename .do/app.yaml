# DigitalOcean App Platform spec.
# Replace YOUR_GITHUB_USERNAME before using "Create App from spec",
# or just connect the repo in the DO dashboard and it will detect Astro.
name: jakobidavis
region: nyc
static_sites:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/jakobidavis.com
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: dist
    environment_slug: node-js
    envs:
      - key: NODE_VERSION
        value: "22"
domains:
  - domain: jakobidavis.com
    type: PRIMARY
  - domain: www.jakobidavis.com
    type: ALIAS
